  description: "REST contract K1, generated from this API. Real example responses are in `contracts/samples`.\n\
    \nRules for every client:\n\n- Send `Authorization: Bearer <token>` with one of the fixed K7 demo\
    \ tokens.\n- Send `Idempotency-Key` on every POST. Reuse the key when retrying the same command,\n\
    \  including after a timeout, and use a new key for each new intention.\n- A repeated command returns\
    \ the stored response with status 200.\n- A rejected command is not stored. Retrying its key evaluates\
    \ the command again.\n"
