; PlatformIO project. The sources live in ramp_node/ so the same folder also opens
; as a sketch in the Arduino IDE (board "ESP32 Dev Module").

[platformio]
src_dir = ramp_node

[env:esp32dev]
platform = espressif32@^6
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    marvinroger/AsyncMqttClient@^0.9.0
    bblanchon/ArduinoJson@^7
    madhephaestus/ESP32Servo@^1.1.1
    thomasfredericks/Bounce2@^2.72
build_flags = -Wall
